build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true

processors:
  active: true

console-reports:
  active: true

output-reports:
  active: true
  exclude:
    - 'TxtOutputReport'
    - 'XmlOutputReport'
    - 'SarifOutputReport'
    - 'MdOutputReport'

comments:
  active: false

complexity:
  LongMethod:
    # Compose screens are declarative and often longer than JVM helpers.
    threshold: 120
    ignoreAnnotated: ['Composable']
  LongParameterList:
    functionThreshold: 10
    constructorThreshold: 12
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 20
    thresholdInInterfaces: 15
    thresholdInObjects: 20
    ignoreDeprecated: true
    ignorePrivate: true
    ignoreOverridden: true
    ignoreAnnotated: ['Composable']
  ComplexCondition:
    threshold: 5
  CyclomaticComplexMethod:
    threshold: 18
    ignoreAnnotated: ['Composable']
  NestedBlockDepth:
    threshold: 5
  LargeClass:
    threshold: 800

coroutines:
  active: true

empty-blocks:
  active: true

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false

naming:
  active: true
  FunctionNaming:
    # Compose @Composable functions use PascalCase.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

performance:
  active: true

potential-bugs:
  active: true

style:
  active: true
  MagicNumber:
    active: false
  WildcardImport:
    active: true
  ReturnCount:
    max: 6
  MaxLineLength:
    maxLineLength: 140
    excludeCommentStatements: true
  ForbiddenComment:
    active: false
  UnusedPrivateMember:
    active: true
  UnnecessaryAbstractClass:
    active: false

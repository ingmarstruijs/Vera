name: Changelog on merge

# Prepends a Keep-a-Changelog-style bullet under ## Unreleased → ### Merged
# when a PR lands on main. Skips titles containing [skip changelog].
#
# Opens a follow-up PR instead of pushing to main (no Ruleset bypass needed
# for github-actions[bot]). See docs/contributing.md.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  prepend:
    name: Prepend CHANGELOG entry
    if: >
      github.event.pull_request.merged == true &&
      !contains(github.event.pull_request.title, '[skip changelog]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepend merge entry
        id: prepare
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          export DATE
          DATE="$(date -u +%Y-%m-%d)"

          if grep -qF "[#${PR_NUMBER}](" CHANGELOG.md; then
            echo "CHANGELOG already mentions #${PR_NUMBER}; skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 <<'PY'
          from pathlib import Path
          import os

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          date = os.environ["DATE"]
          number = os.environ["PR_NUMBER"]
          title = os.environ["PR_TITLE"]
          url = os.environ["PR_URL"]
          entry = f"- [#{number}]({url}) — {title} ({date})\n"

          marker_unreleased = "## Unreleased"
          marker_merged = "### Merged"
          if marker_unreleased not in text:
              raise SystemExit("CHANGELOG.md missing ## Unreleased heading")

          before, after = text.split(marker_unreleased, 1)
          unreleased_body, *rest_sections = after.split("\n## ", 1)
          tail = ("\n## " + rest_sections[0]) if rest_sections else ""

          if marker_merged in unreleased_body:
              head, rest = unreleased_body.split(marker_merged, 1)
              lines = rest.splitlines(keepends=True)
              i = 0
              while i < len(lines) and lines[i].strip() == "":
                  i += 1
              unreleased_body = (
                  head + marker_merged + "".join(lines[:i]) + entry + "".join(lines[i:])
              )
          else:
              trimmed = unreleased_body.lstrip("\n")
              unreleased_body = f"\n\n{marker_merged}\n\n{entry}\n{trimmed}"

          path.write_text(
              before + marker_unreleased + unreleased_body + tail,
              encoding="utf-8",
          )
          print(f"Prepended: {entry.strip()}")
          PY

          if git diff --quiet CHANGELOG.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open changelog PR
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          BRANCH="chore/changelog-record-${PR_NUMBER}"
          TITLE="chore(changelog): record #${PR_NUMBER} [skip changelog]"

          # Idempotent: reuse branch if a previous run left one
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add CHANGELOG.md
          git commit -m "$TITLE" || {
            echo "Nothing to commit."
            exit 0
          }
          git push -u origin "HEAD:refs/heads/${BRANCH}" --force

          EXISTING="$(gh pr list --head "$BRANCH" --base main --state open --json number -q '.[0].number // empty')"
          if [[ -n "$EXISTING" ]]; then
            echo "Changelog PR already open: #${EXISTING}"
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body "Automated CHANGELOG update for #${PR_NUMBER}.

          Title includes \`[skip changelog]\` so this merge does not recurse.

          Please merge when CI is green (or enable auto-merge)."

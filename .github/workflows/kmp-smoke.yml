name: KMP smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kmp-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-and-android:
    name: Shared tests + Android assembleDebug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # v3 defaults included the removed Google `tools` package and fails.
      # v4 installs platform-tools only by default.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Core unit tests
        run: ./gradlew :core:testDebugUnitTest --stacktrace

      - name: Shared unit tests
        run: ./gradlew :shared:testDebugUnitTest --stacktrace

      - name: Detekt
        run: ./gradlew :core:detekt :shared:detekt :ui:detekt :androidApp:detekt --stacktrace

      - name: Android lint (a11y-focused)
        run: ./gradlew :androidApp:lintDebug --stacktrace

      - name: Assemble UI + Android debug
        run: ./gradlew :ui:assembleDebug :androidApp:assembleDebug --stacktrace

  # iOS: shared Compose UI will use a CMP host (SwiftUI removed). macOS compile is a
  # follow-up once :ui exposes iosMain / MainViewController — see iosApp/README.md.

name: KMP smoke

on:
  push:
    branches: [main, cursor/**]
  pull_request:
    branches: [main]

jobs:
  shared-and-android:
    name: Shared tests + Android assembleDebug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # v3 defaults included the removed Google `tools` package and fails.
      # v4 installs platform-tools only by default.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Shared unit tests
        run: ./gradlew :shared:testDebugUnitTest --stacktrace

      - name: Assemble Android debug
        run: ./gradlew :androidApp:assembleDebug --stacktrace

  # iOS compile needs a macOS runner + Xcode; left as a follow-up once Shared
  # framework packaging is wired into the Xcode project (see iosApp/README.md).
